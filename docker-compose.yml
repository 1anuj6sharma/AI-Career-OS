version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: career-os-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: career-os-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI Career Operating System
      - APP_VERSION=1.0.0
      - APP_ENV=development
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - SECRET_KEY=ai_career_os_super_secret_key_2026_development_123456789
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/career_os
      - REDIS_URL=redis://localhost:6379
      - BACKEND_CORS_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: career-os-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
